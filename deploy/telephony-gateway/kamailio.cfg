#!KAMAILIO
#
# in.pulse WebRTC -> SIP gateway for PBXs without WebRTC (e.g. Asterisk 1.8, chan_sip over UDP).
#
#   browser (JsSIP) --wss--> nginx (TLS) --ws--> Kamailio --udp--> PBX (ZeroTier)
#   media: browser <--DTLS-SRTP/ICE--> rtpengine <--plain RTP--> PBX
#
# Kamailio is NOT a registrar. REGISTER and INVITE go to the PBX, which authenticates the extension
# with the operator's own SIP password. Each WebSocket is authorized once, during the handshake, by
# users-service (GET /api/telephony/gateway/authorize), which answers "sipUser:pbxHost:pbxPort".
# Every request on that connection must use that From user and that PBX.
#
# The browser's Contact is rewritten to point at this gateway (alias = WS connection, gwc = binding),
# so the PBX needs neither WebSocket support nor Path, and sends calls for the extension back here.
#
# STATUS: written for Kamailio 5.8 and checked against its module docs/source (2026-09-30); never run.
# Validate with "kamailio -c" and the checklist in README.md before using it.
#
# Deployment values (addresses, key, origin, media directions) come from gateway-defs.cfg:
# gateway-defs.example.cfg for a native install, rendered by local/kamailio-entrypoint.sh in Docker.
include_file "/etc/kamailio/gateway-defs.cfg"

####### Global parameters #########
debug=2
log_stderror=no
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
children=4
auto_aliases=no

# WebSocket from nginx (plain; TLS ends in nginx) and SIP towards the PBXs (ZeroTier address only).
listen=tcp:GW_WS_ADDR
listen=udp:GW_SIP_LISTEN advertise GW_SIP_ADVERTISE

tcp_accept_no_cl=yes
http_reply_parse=yes
tcp_connection_lifetime=3605
tcp_keepalive=yes

####### Modules ########
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "corex.so"
loadmodule "nathelper.so"
loadmodule "htable.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
loadmodule "http_client.so"
loadmodule "rtpengine.so"

# Transport switch WS <-> UDP needs two Record-Route headers.
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)

# conid -> "sipUser:pbxHost:pbxPort". Removed when the WebSocket closes; expiry is a safety net.
modparam("htable", "htable", "wsconn=>size=10;autoexpire=90000;")

modparam("http_client", "connection_timeout", 3)

modparam("rtpengine", "rtpengine_sock", "GW_RTPENGINE")

####### Routing logic ########

request_route {
#!ifdef GW_TRACE
	xlog("L_INFO", "trace: $rm $ru from $si:$sp ($proto) From=$fU conn=$conid\n");
	if (is_method("BYE") && $proto == "udp") xlog("L_INFO", "trace: message from PBX:\n$mb\n");
#!endif
	route(REQINIT);
#!ifdef GW_TRACE
	xlog("L_INFO", "trace: $rm passed REQINIT\n");
#!endif

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			rtpengine_manage();
			route(RELAY);
		}
		exit;
	}

	if (!is_method("ACK")) {
		if (t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	route(BINDING);
	route(WITHINDLG);

	remove_hf("Route");
	if ($proto =~ "ws") {
		route(TO_PBX);
	}
	route(FROM_PBX);
}

route[REQINIT] {
	# First, so every reply (including sanity rejections) goes to the real source port. Asterisk 1.8 peers
	# with nat=no send no rport, and without this the reply goes to received-IP:Via-port, which is lost
	# when the PBX traffic arrives through NAT.
	force_rport();
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}
	# Checks of Kamailio's default configuration, without digest-credential validation: Asterisk 1.8
	# puts Proxy-Authorization with nonce="" in its BYE, which the full check rejects. A failed check
	# replies by itself and returns 0, which ends the script (so nothing after it runs).
	if (!sanity_check("17895", "7")) {
		xlog("L_WARN", "gateway: malformed request from $si:$sp\n");
		exit;
	}
}

# Requests received on a WebSocket must come from an authorized connection and from its own extension.
route[BINDING] {
	if (!($proto =~ "ws")) return;
	# Test the htable item itself: a $var() is never $null (assigning $null makes it 0).
	if ($sht(wsconn=>$conid) == $null) {
		sl_send_reply("403", "Not Authorized");
		exit;
	}
	$var(binding) = $sht(wsconn=>$conid);
	$var(user) = $(var(binding){s.select,0,:});
	$var(pbxhost) = $(var(binding){s.select,1,:});
	$var(pbxport) = $(var(binding){s.select,2,:});
	if ($fU != $var(user)) {
		xlog("L_WARN", "gateway: From user $fU differs from bound user $var(user) (conn $conid)\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
}

route[WITHINDLG] {
	if (!has_totag()) return;
#!ifdef GW_TRACE
	xlog("L_INFO", "trace: in-dialog $rm Route=[$hdr(Route)] ruri=$ru\n");
#!endif
	if (loose_route()) {
#!ifdef GW_TRACE
		xlog("L_INFO", "trace: in-dialog $rm routed, du=$du\n");
#!endif
		if (!($proto =~ "ws")) route(TO_BROWSER_TARGET);
		if (is_method("BYE")) {
			rtpengine_manage();
		} else if (is_method("INVITE|UPDATE")) {
			route(MEDIA_OFFER);
		} else if (is_method("ACK") && has_body("application/sdp")) {
			route(MEDIA_ANSWER);
		}
		if (is_method("INVITE|UPDATE")) {
			if ($proto =~ "ws") route(CONTACT_FOR_PBX);
			t_on_reply("REPLY");
		}
		route(RELAY);
	}
	if (is_method("ACK")) {
		if (t_check_trans()) route(RELAY);
		exit;
	}
	sl_send_reply("404", "Not Here");
	exit;
}

# Initial requests from the browser: only REGISTER and INVITE, only to the bound PBX.
route[TO_PBX] {
	if (!is_method("REGISTER|INVITE")) {
		sl_send_reply("405", "Method Not Allowed");
		exit;
	}
	# {uri.port} is empty (and integer 0) without a port: test its length, compare as strings.
	if ($(ru{uri.port}{s.len}) == 0) {
		$var(rport) = "5060";
	} else {
		$var(rport) = "" + $(ru{uri.port});
	}
	if ($rd != $var(pbxhost) || $var(rport) != $var(pbxport)) {
		xlog("L_WARN", "gateway: $rm to $rd:$var(rport) refused, bound PBX is $var(pbxhost):$var(pbxport)\n");
		sl_send_reply("403", "Forbidden Destination");
		exit;
	}
	route(CONTACT_FOR_PBX);
	if (is_method("INVITE")) {
		record_route();
		route(MEDIA_OFFER);
		t_on_reply("REPLY");
	}
	$du = "sip:" + $var(pbxhost) + ":" + $var(pbxport) + ";transport=udp";
	$fs = "udp:GW_SIP_LISTEN";
	route(RELAY);
}

# Initial requests from a PBX (incoming call, qualify OPTIONS) addressed to a browser Contact written by
# CONTACT_FOR_PBX. The binding must exist and the request must come from the PBX that binding allows.
route[FROM_PBX] {
	$var(gwc) = $(ru{uri.param,gwc});
	if ($var(gwc) == "" || $(ru{uri.param,alias}) == "") {
		sl_send_reply("404", "Not Found");
		exit;
	}
	if ($sht(wsconn=>$var(gwc)) == $null) {
		sl_send_reply("480", "Temporarily Unavailable");
		exit;
	}
	$var(binding) = $sht(wsconn=>$var(gwc));
#!ifndef GW_PBX_SOURCE_NATTED
	if ($si != $(var(binding){s.select,1,:})) {
		xlog("L_WARN", "gateway: $rm from $si refused for binding $var(gwc)\n");
		sl_send_reply("403", "Forbidden");
		exit;
	}
#!else
	# PBX traffic arrives through NAT (Docker Desktop), so $si is not the PBX: the host firewall must
	# restrict the published SIP port to the PBX address instead.
#!endif
	if (!handle_ruri_alias()) {
		sl_send_reply("480", "Temporarily Unavailable");
		exit;
	}
	if (is_method("INVITE")) {
		record_route();
		route(MEDIA_OFFER);
		t_on_reply("REPLY");
	}
	route(RELAY);
}

# In-dialog requests towards the browser: the target is the rewritten Contact. The extension's
# credentials Asterisk 1.8 copies into in-dialog requests are not forwarded to the browser.
route[TO_BROWSER_TARGET] {
	remove_hf("Proxy-Authorization");
	if ($(ru{uri.param,alias}) != "") handle_ruri_alias();
}

# Replace the browser Contact (sip:x@y.invalid;transport=ws) by one the PBX can reach: this gateway,
# carrying the WebSocket connection (alias) and the binding id (gwc). The user part is kept because
# JsSIP recognizes its Contact in REGISTER replies and incoming requests by that user.
route[CONTACT_FOR_PBX] {
	if (!is_present_hf("Contact") || $ct == "*") return;
	$var(ctuser) = $(ct{nameaddr.uri}{uri.user});
	if (!($var(ctuser) =~ "^[A-Za-z0-9._~-]+$")) $var(ctuser) = $fU;
	$var(ctparams) = "";
	if ($ct =~ "expires=[0-9]+") {
		$var(ctparams) = ";expires=" + $(ct{re.subst,/^.*expires=([0-9]+).*/\1/});
	}
	remove_hf("Contact");
	append_hf("Contact: <sip:$var(ctuser)@GW_SIP_ADVERTISE;alias=$si~$sp~$prid;gwc=$conid>$var(ctparams)\r\n");
}

# rtpengine: WebRTC (ICE, DTLS-SRTP, rtcp-mux) on the browser side, plain RTP on the PBX side.
# GW_MEDIA_FROM_* hold the direction= flags when rtpengine has two interfaces (browser side "pub",
# PBX side "zt"); they are given on offers only, rtpengine keeps the interfaces for the answer.
route[MEDIA_OFFER] {
	if (!has_body("application/sdp")) return;
	if ($proto =~ "ws") {
		rtpengine_manage("GW_MEDIA_FROM_BROWSER ICE=remove RTP/AVP rtcp-mux-demux SDES-off replace-origin");
	} else {
		rtpengine_manage("GW_MEDIA_FROM_PBX UDP/TLS/RTP/SAVPF ICE=force rtcp-mux-offer rtcp-mux-require SDES-off generate-mid replace-origin");
	}
}

route[MEDIA_ANSWER] {
	if ($proto =~ "ws") {
		rtpengine_manage("ICE=remove RTP/AVP rtcp-mux-demux SDES-off replace-origin");
	} else {
		rtpengine_manage("UDP/TLS/RTP/SAVPF ICE=force rtcp-mux-require SDES-off replace-origin");
	}
}

route[RELAY] {
	if (!t_relay()) sl_reply_error();
	exit;
}

#!ifdef GW_TRACE
# Default reply route: runs for every reply (REGISTER included), before the transaction's own route.
onreply_route {
	xlog("L_INFO", "trace: reply $rs $rr to $rm from $si:$sp ($proto)\n");
}
#!endif

onreply_route[REPLY] {
	if ($proto =~ "ws" && is_present_hf("Contact")) route(CONTACT_FOR_PBX);
	if (has_body("application/sdp")) {
		route(MEDIA_ANSWER);
	} else if ($rs >= 300 && is_method("INVITE")) {
		rtpengine_manage();
	}
}

# WebSocket handshake from nginx. The token in the query string is checked by users-service before
# the upgrade; the answer binds this connection to one extension and one PBX.
event_route[xhttp:request] {
	set_reply_close();
	set_reply_no_connect();
	if (!($hdr(Upgrade) =~ "websocket" && $hdr(Connection) =~ "Upgrade" && $rm == "GET")) {
		xhttp_reply("404", "Not Found", "", "");
		exit;
	}
	if ($hdr(Origin) != "GW_ORIGIN") {
		xlog("L_WARN", "gateway: handshake from origin $hdr(Origin) refused\n");
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}
	$var(token) = $(hu{url.querystring}{param.value,token,&});
	if (!($var(token) =~ "^[A-Za-z0-9_.-]{20,2048}$")) {
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}
	$var(url) = "GW_USERS_URL/api/telephony/gateway/authorize?token=" + $var(token);
	$var(status) = http_client_query("$var(url)", "", "X-Telephony-Gateway-Key: GW_API_KEY", "$var(binding)");
	if ($var(status) != 200 || !($var(binding) =~ "^[A-Za-z0-9_.+*-]+:[0-9.]+:[0-9]+$")) {
		xlog("L_WARN", "gateway: handshake refused by users-service (status $var(status))\n");
		xhttp_reply("403", "Forbidden", "", "");
		exit;
	}
	if (ws_handle_handshake()) {
		$sht(wsconn=>$conid) = $var(binding);
		xlog("L_INFO", "gateway: conn $conid bound to $var(binding)\n");
	}
	exit;
}

# $conid is no longer available here; the websocket module provides $ws_conid.
event_route[websocket:closed] {
	$sht(wsconn=>$ws_conid) = $null;
}
