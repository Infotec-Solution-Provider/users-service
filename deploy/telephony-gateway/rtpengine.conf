# rtpengine for the in.pulse telephony gateway (see kamailio.cfg, route MEDIA).
# Two interfaces: "pub" faces the browsers (WebRTC), "zt" faces the PBXs over ZeroTier (plain RTP).
# STATUS: template, not yet run. Replace the addresses (README.md, "Configuração").
[rtpengine]
# pub/<address bound on the server>[!<advertised public address when behind NAT>]
interface = pub/203.0.113.10;zt/172.22.0.1
listen-ng = 127.0.0.1:2223
# Open this UDP range on the server firewall for the public interface.
port-min = 30000
port-max = 30999
# Userspace forwarding is enough for a few dozen calls; the kernel module is optional.
table = -1
timeout = 60
silent-timeout = 3600
tos = 184
log-level = 6
log-facility = local1
