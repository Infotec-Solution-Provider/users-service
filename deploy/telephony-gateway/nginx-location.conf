# Include inside the existing HTTPS server block that already serves the in.pulse domain
# (the browser connects to TELEPHONY_GATEWAY_WSS_URL, e.g. wss://inpulse.infotecrs.inf.br/telephony-gw).
# TLS ends here with the domain's current certificate; Kamailio receives plain WebSocket on 127.0.0.1:8090.
#
# In the http {} block (once):
#   limit_req_zone $binary_remote_addr zone=telephony_gw:10m rate=20r/m;
#
location = /telephony-gw {
    limit_req zone=telephony_gw burst=10 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    # Kamailio checks the Origin sent by the browser.
    proxy_set_header Origin $http_origin;
    # JsSIP re-registers every 600 s; keep idle WebSockets open longer than that.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # The token travels in the query string: do not log it.
    access_log off;
}
