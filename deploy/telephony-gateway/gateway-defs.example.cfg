# Deployment values for kamailio.cfg (included from /etc/kamailio/gateway-defs.cfg).
# Copy to /etc/kamailio/gateway-defs.cfg, fill in, and keep it readable only by root/kamailio (it holds the API key).
# Values must not contain "!", the delimiter used below.

# WebSocket from nginx (plain; TLS ends in nginx).
#!substdef "!GW_WS_ADDR!127.0.0.1:8090!g"
# Local UDP socket towards the PBXs and the address they reach it at (the same on a native install).
#!substdef "!GW_SIP_LISTEN!172.22.0.1:5060!g"
#!substdef "!GW_SIP_ADVERTISE!172.22.0.1:5060!g"
# users-service, queried during the WebSocket handshake.
#!substdef "!GW_USERS_URL!http://127.0.0.1:8001!g"
# Same value as TELEPHONY_GATEWAY_API_KEY in users-service.
#!substdef "!GW_API_KEY!TROQUE_PELA_TELEPHONY_GATEWAY_API_KEY!g"
# Origin of the in.pulse frontend (the browser sends it in the handshake).
#!substdef "!GW_ORIGIN!https://inpulse.infotecrs.inf.br!g"
# rtpengine control socket (listen-ng).
#!substdef "!GW_RTPENGINE!udp:127.0.0.1:2223!g"
# rtpengine interfaces (rtpengine.conf): browser side "pub", PBX side "zt".
#!substdef "!GW_MEDIA_FROM_BROWSER!direction=pub direction=zt!g"
#!substdef "!GW_MEDIA_FROM_PBX!direction=zt direction=pub!g"
