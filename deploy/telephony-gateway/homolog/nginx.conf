# Included ONLY in the public HTTPS vhost; no query-string access/error logs.
# Per-source connection/rate limits have their own http-context zones.
location = /telephony-gw {
    limit_req zone=homolog_telephony_rate burst=10 nodelay;
    limit_conn homolog_telephony_connections 20;
    proxy_pass http://127.0.0.1:7170;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    access_log off;
    error_log /dev/null;
}
